_ > nanoagent.plugin.v0001.ManifestConfig:
id: paraphrase-check
name: Paraphrase Check
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  pin_pairs:
    description: Read a batch's answer key from the bundled PAWS snapshot, pinned by its SHA-256; the task's answer key, never shown to the model
  read_pairs:
    description: Show a batch's 4 sentence pairs, each with whether its two sentences use the same words and where they differ, word by word

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  judge-pairs:
    description: Decide, for each of 4 sentence pairs that share most of their words, whether the two sentences mean the same
    runner: decide
    tools: [read_pairs]
    reference: pin_pairs
    instructions: |-
      1. Read the batch with read_pairs.
      2. For each pair p1 to p4, decide whether sentences A and B mean the same thing: the same people, places, things, numbers and dates, each in the same role. Moving a phrase or rewording it keeps the meaning; swapping who did what to whom, which name goes with which title, place or date, or which word a modifier belongs to changes it.
      3. same_words and changes are only hints: two sentences with the same words in another order can mean different things, and many changes can still mean the same. Use changes to see what moved, then decide from what each sentence says.
      4. Every batch holds both kinds: 1 to 3 of its 4 pairs mean the same.
      5. Submit the batch and a verdict for each pair, same or different. The verdicts are asked one pair at a time, p1 to p4: weigh only the pair you are asked, and do not decide the pairs when you are only asked what comes next.
      6. Judge a pair in three short steps: for each change, write in one line what it binds in A and what in B (who, what, where, when); say whether any binding differs; answer different if one does and same if none does. Do not go back over a pair you have judged. An awkward or ungrammatical B can still mean the same.
      7. Each answer, your thinking included, must fit in 2,048 tokens, and an answer cut off scores 0 for the whole batch: when you cannot tell after the three steps, take the verdict you judge more likely. The answer itself is only the JSON asked for.
